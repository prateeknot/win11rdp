# language: YAML, file: .github/workflows/main.yml, target: GitHub Actions windows-latest
name: RDP

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: 'Tailscale hostname (default: gh-runner-<run_id>)'
        required: false
        type: string
      password:
        description: 'RDP password (default: Rdp@12345)'
        required: false
        default: 'Rdp@12345'
        type: string
      exit_node:
        description: 'Advertise as Tailscale exit node (needs admin approval)'
        required: false
        default: false
        type: boolean
      install_tools:
        description: 'Comma-separated Chocolatey packages (e.g., 7zip,git,python)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rdp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 1 -Force
          Get-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-Tailscale" `
            -Direction Inbound -Action Allow -Protocol TCP `
            -LocalPort 3389 -RemoteAddress 100.64.0.0/10 -Profile Any

          $ok = $false
          for ($i = 0; $i -lt 3 -and -not $ok; $i++) {
              try {
                  Restart-Service -Name TermService -Force -ErrorAction Stop
                  $ok = $true
              } catch {
                  Write-Host "TermService restart attempt $($i+1) failed: $_"
                  Start-Sleep -Seconds 5
              }
          }
          if (-not $ok) { Write-Error "TermService restart failed"; exit 1 }
          Start-Sleep -Seconds 5

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ inputs.password }}
        run: |
          $password = if ($env:RDP_PASSWORD) { $env:RDP_PASSWORD } else { "Rdp@12345" }

          $secCfg = "$env:TEMP\secpol.cfg"
          $secDb  = "$env:TEMP\secedit.sdb"
          secedit /export /cfg "$secCfg"
          (Get-Content $secCfg) `
              -replace 'PasswordComplexity = 1', 'PasswordComplexity = 0' `
              -replace 'MinimumPasswordLength = \d+', 'MinimumPasswordLength = 0' `
              | Set-Content $secCfg -Encoding Unicode
          secedit /configure /db "$secDb" /cfg "$secCfg" /areas SECURITYPOLICY
          Remove-Item $secCfg -Force -ErrorAction SilentlyContinue
          Remove-Item $secDb  -Force -ErrorAction SilentlyContinue

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "RDP" -Password $securePass `
                  -AccountNeverExpires -PasswordNeverExpires -ErrorAction Stop
          } else {
              Set-LocalUser    -Name "RDP" -Password $securePass -ErrorAction Stop
              Set-LocalUser    -Name "RDP" -PasswordNeverExpires $true -ErrorAction SilentlyContinue
          }
          Add-LocalGroupMember -Group "Administrators"       -Member "RDP" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" -ErrorAction SilentlyContinue

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          TS_HOSTNAME_INPUT: ${{ inputs.hostname }}
          TS_EXIT_NODE: ${{ inputs.exit_node }}
        run: |
          $hostname = if ($env:TS_HOSTNAME_INPUT) { $env:TS_HOSTNAME_INPUT } else { "gh-runner-$env:GITHUB_RUN_ID" }
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          $tsArgs = @("up", "--hostname=$hostname", "--ephemeral", "--accept-dns=false")
          if ($env:TS_EXIT_NODE -eq "true") { $tsArgs += "--advertise-exit-node" }

          if ($env:TS_AUTHKEY) {
              Write-Host "Auth key present — non-interactive login."
              & $ts @tsArgs
          } else {
              Write-Host "No auth key — starting interactive browser login flow."
              $job = Start-Job -ScriptBlock {
                  $exe = $using:ts
                  $a   = $using:tsArgs
                  & $exe @a
              }

              # Poll job output for the auth URL
              $authUrl = $null
              for ($i = 0; $i -lt 30 -and -not $authUrl; $i++) {
                  Start-Sleep -Seconds 2
                  $out = Receive-Job $job -Keep 2>&1 | Out-String
                  if ($out -match '(https://login\.tailscale\.com/\S+)') {
                      $authUrl = $matches[1].Trim()
                  }
              }

          if ($authUrl) {
              Write-Host ""
              Write-Host "===================================================="
              Write-Host "OPEN THIS URL IN YOUR BROWSER TO AUTHENTICATE:"
              Write-Host "  $authUrl"
              Write-Host "===================================================="
              Write-Host ""
              $lines = @(
                '## 🔐 Tailscale Login Required',
                '',
                'Open this URL in your browser, log in with your Tailscale account, and approve the device:',
                '',
                ('**[' + $authUrl + '](' + $authUrl + ')**'),
                '',
                ('Device name: `' + $hostname + '`'),
                '',
                '_This step waits up to 10 minutes for you to authenticate._'
              )
              $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
              Write-Warning "Could not capture auth URL. Check job output below."
          }

              # Wait for tailscale up job to finish (= authentication complete)
              $waited = 0
              while ($job.State -eq 'Running' -and $waited -lt 600) {
                  Start-Sleep -Seconds 5
                  $waited += 5
                  if ($waited % 30 -eq 0) {
                      Write-Host "[$(Get-Date)] Waiting for browser auth... ($waited s)"
                  }
              }
              if ($job.State -eq 'Running') {
                  Stop-Job $job -ErrorAction SilentlyContinue
                  Remove-Job $job -Force -ErrorAction SilentlyContinue
                  Write-Error "Tailscale auth timed out after 10 minutes."
                  exit 1
              }
              Write-Host "--- tailscale up output ---"
              Receive-Job $job 2>&1 | Write-Host
              Remove-Job $job -Force -ErrorAction SilentlyContinue
          }

          # Confirm IP assignment
          $tsIP = $null
          for ($i = 0; $i -lt 12 -and -not $tsIP; $i++) {
              $raw = & $ts ip -4 2>$null | Select-Object -First 1
              if ($raw) { $tsIP = $raw.Trim() }
              if (-not $tsIP) { Start-Sleep -Seconds 5 }
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          "TAILSCALE_IP=$tsIP"    | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TS_HOSTNAME=$hostname" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure RDP Session
        shell: pwsh
        run: |
          $rdpKey = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          Set-ItemProperty -Path $rdpKey -Name "MaxIdleTime"          -Value 0 -Force
          Set-ItemProperty -Path $rdpKey -Name "MaxDisconnectionTime" -Value 0 -Force
          Set-ItemProperty -Path $rdpKey -Name "fDisableClip"         -Value 0 -Force
          Set-ItemProperty -Path $rdpKey -Name "fDisableCdm"          -Value 0 -Force
          Set-ItemProperty -Path $rdpKey -Name "fDisableCcm"          -Value 0 -Force
          Set-ItemProperty -Path $rdpKey -Name "fDisableLPT"          -Value 0 -Force
          Set-ItemProperty -Path $rdpKey -Name "fDisablePNPRedir"     -Value 0 -Force
          Set-ItemProperty -Path $rdpKey -Name "fDisableAudioCapture" -Value 0 -Force
          try { Restart-Service -Name TermService -Force -ErrorAction Stop } catch { Write-Host "TermService restart: $_" }
          Start-Sleep -Seconds 3

      - name: Install Tools
        if: inputs.install_tools != ''
        shell: pwsh
        run: |
          $tools = "${{ inputs.install_tools }}" -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          foreach ($tool in $tools) {
              Write-Host "Installing $tool..."
              choco install $tool -y --no-progress
          }

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $ok = $false
          for ($i = 0; $i -lt 5 -and -not $ok; $i++) {
              $r = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
              if ($r.TcpTestSucceeded) { $ok = $true } else { Start-Sleep -Seconds 5 }
          }
          if (-not $ok) { Write-Error "TCP connection to RDP port 3389 failed"; exit 1 }
          Write-Host "TCP connectivity successful!"
          & "$env:ProgramFiles\Tailscale\tailscale.exe" status

      - name: Connection Info
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ inputs.password }}
        run: |
          $password = if ($env:RDP_PASSWORD) { $env:RDP_PASSWORD } else { "Rdp@12345" }
          $lines = @(
            '## RDP Connection Info',
            '',
            ('- **Tailscale IP:** ' + $env:TAILSCALE_IP),
            ('- **Hostname:** ' + $env:TS_HOSTNAME),
            '- **Username:** RDP',
            ('- **Password:** ' + $password),
            '- **Port:** 3389',
            '- **Security:** NLA off, SecurityLayer=Negotiate (TLS when client supports)',
            ''
          )
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          & "$env:ProgramFiles\Tailscale\tailscale.exe" status | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Maintain Connection
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          RDP_PASSWORD: ${{ inputs.password }}
          TS_EXIT_NODE: ${{ inputs.exit_node }}
        run: |
          $password = if ($env:RDP_PASSWORD) { $env:RDP_PASSWORD } else { "Rdp@12345" }
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Hostname: $env:TS_HOSTNAME"
          Write-Host "Username: RDP"
          Write-Host "Password: $password"
          Write-Host "==================`n"
          while ($true) {
              $null = & "$env:ProgramFiles\Tailscale\tailscale.exe" status 2>$null
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "[$(Get-Date)] Tailscale down, reconnecting..."
                  $tsArgs = @(
                      "up",
                      "--hostname=$env:TS_HOSTNAME",
                      "--ephemeral",
                      "--accept-dns=false"
                  )
                  if ($env:TS_EXIT_NODE -eq "true") { $tsArgs += "--advertise-exit-node" }
                  & "$env:ProgramFiles\Tailscale\tailscale.exe" @tsArgs 2>$null
              }
              Write-Host "[$(Get-Date)] RDP Active - IP: $env:TAILSCALE_IP - Cancel workflow to terminate"
              Start-Sleep -Seconds 300
          }

      - name: Self-Destruct Cleanup
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "=== SELF-DESTRUCT SEQUENCE START ==="

          try {
              (query user) 2>$null | Select-Object -Skip 1 | ForEach-Object {
                  if ($_ -match '^\s*(\S+)\s+') {
                      $u = $matches[1]
                      if ($u -and $u -ne 'USERNAME') { logoff $u 2>$null }
                  }
              }
          } catch {}

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path $ts) {
              & $ts logout 2>$null
              & $ts down   2>$null
              Start-Sleep -Seconds 2
          }

          Stop-Service -Name Tailscale -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          Remove-Item "$env:ProgramData\Tailscale"  -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:LOCALAPPDATA\Tailscale" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:ProgramFiles\Tailscale" -Recurse -Force -ErrorAction SilentlyContinue

          Remove-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
          Remove-Item "C:\Users\RDP"   -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Users\RDP.*" -Recurse -Force -ErrorAction SilentlyContinue

          Get-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule -ErrorAction SilentlyContinue

          Get-Process -Name "mstsc","rdpclip","rdpservice","tscon" -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue

          Remove-Item "$env:APPDATA\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt" -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:APPDATA\Microsoft\PowerShell\PSReadLine\ConsoleHost_history.txt"          -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:USERPROFILE\Documents\PowerShell\PSReadLine\ConsoleHost_history.txt"      -Force -ErrorAction SilentlyContinue

          $logs = @(
              "Security",
              "System",
              "Application",
              "Windows PowerShell",
              "Microsoft-Windows-PowerShell/Operational",
              "Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational",
              "Microsoft-Windows-TerminalServices-LocalSessionManager/Operational"
          )
          foreach ($log in $logs) { wevtutil cl "$log" 2>$null }

          Get-WinEvent -ListLog *RDP* -ErrorAction SilentlyContinue | ForEach-Object {
              wevtutil cl $_.LogName 2>$null
          }
          Get-WinEvent -ListLog *TerminalServices* -ErrorAction SilentlyContinue | ForEach-Object {
              wevtutil cl $_.LogName 2>$null
          }

          Remove-Item "$env:TEMP\*"       -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue

          Remove-Item "C:\Windows\Prefetch\*" -Recurse -Force -ErrorAction SilentlyContinue

          cmdkey /list 2>$null | Select-String "Target:" | ForEach-Object {
              $t = ($_ -replace '.*Target:\s*','').Trim()
              if ($t) { cmdkey /delete:$t 2>$null }
          }

          Remove-Item "HKCU:\Software\Microsoft\Terminal Server Client\Default" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "HKCU:\Software\Microsoft\Terminal Server Client\Servers" -Recurse -Force -ErrorAction SilentlyContinue

          ipconfig /flushdns 2>$null
          arp -d * 2>$null

          Write-Host "=== SELF-DESTRUCT SEQUENCE COMPLETE ==="
